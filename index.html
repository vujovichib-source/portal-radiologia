<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Diagnóstico por Imagen y Rehabilitación — Portal de Pacientes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E2;
    --panel: #FFFDF6;
    --red: #C22A2A;
    --red-deep: #8F1D1D;
    --gold: #E3A73E;
    --gold-deep: #B9791B;
    --green: #4C8C4A;
    --ink: #241F17;
    --ink-dim: #75695A;
    --line: #E8DBBd;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 420px at 85% -8%, rgba(227,167,62,0.16), transparent 60%),
      radial-gradient(ellipse 600px 400px at 5% 10%, rgba(194,42,42,0.05), transparent 60%),
      var(--cream);
    color:var(--ink); font-family:var(--sans); min-height:100vh; line-height:1.5;
  }
  .wrap{max-width:960px; margin:0 auto; padding:40px 24px 80px;}

  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:52px; flex-wrap:wrap; gap:16px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{width:52px; height:52px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .brand-mark img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 5px rgba(140,90,20,0.25));}
  .brand-text .name{font-family:var(--serif); font-weight:600; font-size:18px; color:var(--ink); letter-spacing:0.01em; line-height:1.15;}
  .brand-text .tag{font-size:12px; color:var(--ink-dim); margin-top:2px; letter-spacing:0.02em;}
  nav button{
    background:var(--panel); border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--sans); font-weight:600; font-size:12.5px; letter-spacing:0.02em;
    padding:9px 18px; border-radius:100px; cursor:pointer; transition:all .15s;
  }
  nav button:hover{border-color:var(--gold-deep); color:var(--red-deep); box-shadow:0 2px 10px rgba(140,90,20,0.10);}

  .hero{margin-bottom:44px;}
  .eyebrow{font-family:var(--mono); font-size:11.5px; color:var(--red-deep); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:16px;}
  h1{font-family:var(--serif); font-size:clamp(32px,4.4vw,46px); font-weight:600; color:var(--ink); letter-spacing:-0.01em; max-width:15ch; line-height:1.08; margin-bottom:16px;}
  .hero p{color:var(--ink-dim); max-width:46ch; font-size:15.5px;}

  /* panel - motivo de anillos orbitales, referenciando el logo */
  .lightbox{
    position:relative; border-radius:16px; padding:40px 32px;
    background: var(--panel);
    border:1px solid var(--line);
    overflow:hidden;
    box-shadow: 0 1px 3px rgba(140,90,20,0.06), 0 12px 32px -16px rgba(140,90,20,0.18);
  }
  .lightbox::before{
    content:''; position:absolute; top:-90px; right:-90px; width:340px; height:340px;
    background:
      radial-gradient(circle at center, transparent 0 56px, rgba(194,42,42,0.05) 57px 60px, transparent 61px 96px, rgba(227,167,62,0.09) 97px 100px, transparent 101px 140px, rgba(76,140,74,0.06) 141px 144px, transparent 145px);
    pointer-events:none;
  }
  .corner{display:none;}

  .panel-label{font-family:var(--mono); font-size:11px; color:var(--ink-dim); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:20px; position:relative;}
  .fields{display:grid; grid-template-columns:1fr 1fr; gap:16px; position:relative;}
  @media(max-width:560px){.fields{grid-template-columns:1fr;}}
  .field label{display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; font-weight:600; letter-spacing:0.02em;}
  .field input{
    width:100%; background:#fff; border:1.5px solid var(--line); color:var(--ink);
    padding:12px 14px; border-radius:8px; font-family:var(--mono); font-size:15px; letter-spacing:0.02em;
    transition:border-color .15s;
  }
  .field input:focus{outline:none; border-color:var(--gold-deep);}
  .field input::placeholder{color:#c9bda0;}

  .search-btn{
    margin-top:20px; background:var(--red); color:#fff; border:none; font-weight:600;
    font-family:var(--sans); font-size:14px; padding:13px 28px; border-radius:100px; cursor:pointer;
    transition:transform .1s, box-shadow .15s; position:relative;
  }
  .search-btn:hover{box-shadow:0 6px 18px -4px rgba(194,42,42,0.45);}
  .search-btn:active{transform:scale(0.98);}
  .search-btn:disabled{opacity:0.5; cursor:default; box-shadow:none;}

  .result{margin-top:24px; position:relative;}
  .result-card{
    border:1px solid var(--green); background:rgba(76,140,74,0.06); border-radius:10px;
    padding:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    animation: reveal .35s ease;
  }
  @keyframes reveal{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  .result-card .who{font-family:var(--serif); font-weight:600; font-size:15px; color:var(--ink);}
  .result-card .meta{font-size:12px; color:var(--ink-dim); margin-top:4px;}
  .result-card a{
    background:var(--ink); color:#fff; text-decoration:none; font-weight:600; font-size:13px;
    padding:10px 18px; border-radius:100px; white-space:nowrap;
  }
  .not-found{
    border:1px solid var(--gold); background:rgba(227,167,62,0.10); border-radius:10px; padding:16px 20px;
    color:var(--gold-deep); font-size:13px; font-weight:600;
  }

  .disclaimer{margin-top:18px; font-size:12px; color:var(--ink-dim); display:flex; gap:8px; align-items:flex-start;}
  .disclaimer .dot{width:5px; height:5px; border-radius:50%; background:var(--gold-deep); margin-top:6px; flex-shrink:0;}

  /* servicios */
  .services{margin-top:60px;}
  .services-label{font-family:var(--mono); font-size:11px; color:var(--ink-dim); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:16px;}
  .services-list{display:flex; flex-wrap:wrap; gap:10px;}
  .services-list span{
    background:var(--panel); border:1px solid var(--line); color:var(--ink); font-size:13px;
    padding:8px 16px; border-radius:100px;
  }
  .info-strip{margin-top:32px; display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media(max-width:640px){.info-strip{grid-template-columns:1fr;}}
  .info-strip .item{border-top:2px solid var(--gold); padding-top:12px;}
  .info-strip .item .k{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;}
  .info-strip .item .v{font-size:14px; color:var(--ink); font-weight:600;}

  footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-dim); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  /* admin */
  .admin-gate{max-width:360px; margin:80px auto; text-align:center;}
  .admin-gate h2{font-family:var(--serif); font-weight:600; font-size:18px; color:var(--ink); margin-bottom:18px;}
  .admin-gate input{width:100%; margin-bottom:12px;}
  .admin-gate .search-btn{width:100%;}
  .err{color:var(--red-deep); font-size:12px; font-weight:600; margin-top:10px;}

  .admin-panel h2{font-family:var(--serif); font-weight:600; font-size:17px; color:var(--ink); margin-bottom:18px;}
  .add-form{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;}
  @media(max-width:560px){.add-form{grid-template-columns:1fr;}}
  .add-form .full{grid-column:1/-1;}

  table{width:100%; border-collapse:collapse; margin-top:8px;}
  th{text-align:left; font-family:var(--mono); font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.04em; padding:10px 12px; border-bottom:2px solid var(--line);}
  td{padding:12px; border-bottom:1px solid var(--line); font-size:13px;}
  td.dni{font-family:var(--mono); color:var(--red-deep);}
  td a{color:var(--ink); font-weight:600;}
  .del-btn{background:none; border:1px solid var(--red); color:var(--red-deep); font-size:11px; padding:5px 10px; border-radius:100px; cursor:pointer; font-weight:600;}
  .del-btn:hover{background:rgba(194,42,42,0.08);}
  .empty-row td{color:var(--ink-dim); text-align:center; padding:32px; font-size:13px;}
  .divider{display:flex; align-items:center; gap:16px; margin:52px 0;}
  .divider .line{flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);}
  .divider .mark{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 2px rgba(140,90,20,0.06), 0 6px 16px -6px rgba(140,90,20,0.22);
  }
  .divider .mark::before{
    content:''; width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold), var(--gold-deep));
    box-shadow:0 0 0 5px rgba(227,167,62,0.14);
  }
</style>
</head>

function publicUrl(path){
  if(!path) return null;
  return window.location.origin + '/archivo/' + path;
}

// Para .doc/.docx, los navegadores no pueden mostrarlos directo - los pasamos por el visor de Google Docs.
// Los PDF se abren directo, sin necesidad de visor externo.
function viewUrl(path){
  const raw = publicUrl(path);
  if(!raw) return null;
  const lower = path.toLowerCase();
  if(lower.endsWith('.doc') || lower.endsWith('.docx')){
    return 'https://docs.google.com/viewer?url=' + encodeURIComponent(raw) + '&embedded=true';
  }
  return raw;
}

function renderPatient(){
  let resultHtml = '';

  } else if(searchResult){
    const letras = 'ABCDEFGHIJ';

      ? searchResult.imagenes_paths

    const infUrl = viewUrl(searchResult.informe_path);
    const legacyUrl = (imagenes.length === 0 && !infUrl && searchResult.link_drive) ? searchResult.link_drive : null;

      const etiqueta = imagenes.length > 1 ? `Imagen ${letras[i] || (i+1)}` : 'Ver imagen';

      <p style="margin-bottom:16px;"><strong>¿Cómo se protege la información?</strong><br>
      La base de datos aplica reglas de seguridad a nivel de fila (Row Level Security), lo que impide que un usuario pueda ver información de otro paciente aunque intente acceder directamente. Las contraseñas del personal se almacenan encriptadas, nunca en texto plano. Las imágenes e informes se guardan en un almacenamiento con rutas de acceso aleatorias, no vinculadas a datos identificables del paciente.</p>

      <p style="margin-bottom:16px;"><strong>¿Se comparte tu información con terceros?</strong><br>

      <p style="margin-bottom:16px;"><strong>¿Cuánto tiempo se conservan los datos?</strong><br>
      Los datos se conservan mientras sean necesarios para la atención médica y de acuerdo con lo que establece la normativa vigente en Argentina (Ley 25.326 de Protección de Datos Personales).</p>

function bindGateEvents(){
  const doLogin = async () => {
    const email = document.getElementById('emailInput').value.trim();
    const pass = document.getElementById('passInput').value;
    if(!email || !pass) return;
    busy = true; errMsg=''; render();
    const { error: authError } = await sb.auth.signInWithPassword({ email, password: pass });
    if(authError){ busy=false; errMsg = 'Email o contraseña incorrectos.'; render(); return; }
    const { data: rol, error: rolError } = await sb.rpc('mi_rol');
    busy = false;
    if(rolError || !rol){ errMsg = 'Esta cuenta no tiene acceso al panel.'; await sb.auth.signOut(); render(); return; }
    myRole = rol;
    view = 'admin';
    await loadPatients();
  };
  document.getElementById('enterBtn').onclick = doLogin;
  ['emailInput','passInput'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  });
}

function bindAdminEvents(){
  document.querySelectorAll('.copy-token').forEach(el => {
    el.onclick = () => {
      navigator.clipboard.writeText(el.dataset.token).then(() => {
        const original = el.textContent;
        el.textContent = '¡Copiado!';
        setTimeout(() => { el.textContent = original; }, 1200);
      });
    };
  });

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    myRole = null;
    view = 'patient';
    history.pushState(null, '', '/');
    render();
  };

  function randomPath(patientId, filename){
    const rand = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
    const safeName = filename.replace(/[^a-zA-Z0-9._-]/g, '_');
    return `${rand}/${safeName}`;
  }

  async function uploadFor(patientId, kind, file){
    errMsg=''; successMsg=''; busy = true; render();
    const path = randomPath(patientId, file.name);
    const { error: upErr } = await sb.storage.from('informes').upload(path, file, { upsert: false, cacheControl: '3600' });
    if(upErr){ busy=false; errMsg = 'No se pudo subir el archivo: ' + upErr.message; render(); return; }
    const { error: rpcErr } = await sb.rpc('actualizar_archivos', { p_id: patientId, p_imagen_path: null, p_informe_path: path });
    busy = false;
    if(rpcErr){ errMsg = 'El archivo se subió pero no se pudo vincular al paciente.'; render(); return; }
    successMsg = 'Informe subido correctamente.';
    await loadPatients();
  }

  async function uploadImagenes(patientId, files){
    errMsg=''; successMsg=''; busy = true; render();
    let subidas = 0;
    for(const file of files){
      const path = randomPath(patientId, file.name);
      const { error: upErr } = await sb.storage.from('informes').upload(path, file, { upsert: false, cacheControl: '3600' });
      if(upErr){ errMsg = 'Alguna imagen no se pudo subir: ' + upErr.message; continue; }
      const { error: rpcErr } = await sb.rpc('agregar_imagen', { p_id: patientId, p_path: path });
      if(!rpcErr) subidas++;
    }
    busy = false;
    successMsg = subidas > 0 ? `${subidas} imagen(es) subida(s) correctamente.` : successMsg;
    await loadPatients();
  }

  async function enviarWhatsapp(patientId){
    errMsg=''; successMsg=''; busy = true; render();
    const { error } = await sb.functions.invoke('notificar-whatsapp', { body: { paciente_id: patientId } });
    busy = false;
    if(error){ errMsg = 'No se pudo enviar el WhatsApp. Probá de nuevo.'; render(); return; }
    successMsg = 'WhatsApp enviado correctamente.';
    render();
  }

  document.querySelectorAll('.upload-imagen').forEach(inp => {
    inp.onchange = () => { if(inp.files.length > 0) uploadImagenes(parseInt(inp.dataset.id,10), Array.from(inp.files)); };
  });
  document.querySelectorAll('.upload-informe').forEach(inp => {
    inp.onchange = () => { if(inp.files[0]) uploadFor(parseInt(inp.dataset.id,10), 'informe', inp.files[0]); };
  });

  const searchInput = document.getElementById('staffSearch');
  searchInput.oninput = () => {
    staffQuery = searchInput.value;
    const pos = searchInput.selectionStart;
    render();
    const newInput = document.getElementById('staffSearch');
    newInput.focus();
    newInput.setSelectionRange(pos, pos);
  };

  const aDniInput = document.getElementById('aDni');
  if(aDniInput){ aDniInput.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); }); }
  const aCelInput = document.getElementById('aCelular');
  if(aCelInput){ aCelInput.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); }); }
  ['aNombre','aApellido'].forEach(id => {
    const inp = document.getElementById(id);
    if(inp){ inp.addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); }); }
  });

  document.getElementById('addBtn').onclick = async () => {
    const nombre = document.getElementById('aNombre').value.trim().toUpperCase();
    const apellido = document.getElementById('aApellido').value.trim().toUpperCase();
    const dniCompleto = document.getElementById('aDni').value.trim();
    const estudio = document.getElementById('aEstudio').value.trim();
    const fecha = document.getElementById('aFecha').value || null;
    const link = null;
    const celRest = document.getElementById('aCelular').value.trim();
    const celular = celRest ? ('+549' + celRest) : null;
    if(!nombre || !apellido || dniCompleto.length < 4){
      errMsg = 'Completá al menos nombre, apellido y DNI completo.';
      successMsg = '';
      render();
      return;
    }
    busy = true; errMsg=''; successMsg=''; render();
    let result;
    const wasEditing = !!editingId;
    if(editingId){
      result = await sb.rpc('editar_paciente', {
        p_id: editingId, p_nombre: nombre, p_apellido: apellido, p_dni_completo: dniCompleto,
        p_estudio: estudio, p_link: link, p_fecha: fecha, p_celular: celular
      });
    } else {
      result = await sb.rpc('agregar_paciente', {
        p_nombre: nombre, p_apellido: apellido, p_dni_completo: dniCompleto,
        p_estudio: estudio, p_link: link, p_fecha: fecha, p_celular: celular
      });
    }
    busy = false;
    if(result.error || !result.data){ errMsg = 'No se pudo guardar. Probá de nuevo.'; render(); return; }
    editingId = null;
    successMsg = wasEditing ? 'Cambios guardados.' : 'Paciente agregado.';
    await loadPatients();
  };

  const cancelBtn = document.getElementById('cancelEditBtn');
  if(cancelBtn){
    cancelBtn.onclick = () => { editingId = null; errMsg=''; successMsg=''; render(); };
  }

  document.querySelectorAll('.send-wa-btn').forEach(btn => {
    btn.onclick = () => {
      const id = parseInt(btn.dataset.id, 10);
      const p = patients.find(x => x.id === id);
      const nombreCompleto = p ? `${p.nombre} ${p.apellido}` : 'este paciente';
      if(!confirm(`¿Enviar el WhatsApp de aviso a ${nombreCompleto}?`)) return;
      enviarWhatsapp(id);
    };
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = () => {
      editingId = parseInt(btn.dataset.id, 10);
      errMsg = ''; successMsg = '';
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });

  const selectAll = document.getElementById('selectAllCheck');
  if(selectAll){
    selectAll.onchange = () => {
      const q = normalize(staffQuery);
      const visible = q ? patients.filter(p =>
        normalize(p.nombre).includes(q) || normalize(p.apellido).includes(q) ||
        (p.dni_ultimos4||'').includes(q) || (p.dni_completo||'').includes(q)
      ) : patients;
      if(selectAll.checked){ visible.forEach(p => selectedIds.add(p.id)); }
      else { visible.forEach(p => selectedIds.delete(p.id)); }
      render();
    };
  }

  document.querySelectorAll('.row-check').forEach(cb => {
    cb.onchange = () => {
      const id = parseInt(cb.dataset.id, 10);
      if(cb.checked) selectedIds.add(id); else selectedIds.delete(id);
      render();
    };
  });

  const bulkBtn = document.getElementById('bulkDelBtn');
  if(bulkBtn){
    bulkBtn.onclick = async () => {
      if(!confirm(`¿Eliminar ${selectedIds.size} paciente(s) seleccionado(s)? Esta acción no se puede deshacer.`)) return;
      busy = true; render();
      for(const id of selectedIds){
        await sb.rpc('eliminar_paciente', { p_id: id });
      }
      selectedIds.clear();
      busy = false;
      await loadPatients();
    };
  }

  document.querySelectorAll('.del-btn:not(#bulkDelBtn)').forEach(btn => {
    btn.onclick = async () => {
      const id = parseInt(btn.dataset.id, 10);
      busy = true; render();
      await sb.rpc('eliminar_paciente', { p_id: id });
      selectedIds.delete(id);
      busy = false;
      await loadPatients();
    };
  });
}

async function init(){
  window.addEventListener('popstate', () => {
    if(window.location.pathname === '/acceso'){
      view = myRole ? 'admin' : 'admin-gate';
    } else {
      view = 'patient'; searchResult = undefined;
    }
    render();
  });

  const path = window.location.pathname;
  if(path.startsWith('/r/')){
    const token = decodeURIComponent(path.slice(3)).trim();
    view = 'patient';
    render();
    const { data, error } = await sb.rpc('buscar_por_token', { p_token: token });
    searchResult = (!error && data && data.length > 0) ? data[0] : null;
    render();
    return;
  }

  const wantsAcceso = path === '/acceso';
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    const { data: rol } = await sb.rpc('mi_rol');
    if(rol){
      myRole = rol; view = 'admin';
      if(!wantsAcceso) history.replaceState(null, '', '/acceso');
      await loadPatients(); return;
    }
  }
  if(wantsAcceso){ view = 'admin-gate'; }
  render();
}
init();
</script>
